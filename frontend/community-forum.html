<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Community | Smart Farmer App</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/advanced-features.css" />
</head>
<body>
    <header class="topbar">
        <nav class="navbar">
            <div class="brand">
                <div class="brand-mark">🌾</div>
                <div>
                    <div>Smart Farmer App</div>
                    <small class="muted">Farmer discussion forum</small>
                </div>
            </div>
            <button class="mobile-menu" aria-label="Toggle menu">☰</button>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="sell.html">Sell</a>
                <a href="videos.html">Videos</a>
                <a href="community.html" class="active">Community</a>
                <a href="experts.html">Experts</a>
            </div>
        </nav>
    </header>

    <main class="page-shell">
        <div class="community-top">
            <div class="section-header">
                <div>
                    <p class="kicker">Farmer Community</p>
                    <h2>Share experiences, ask questions, learn together</h2>
                </div>
            </div>

            <div class="create-post-panel">
                <div class="create-post">
                    <img id="creatorAvatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Ccircle cx='100' cy='100' r='100' fill='%232fbf71'/%3E%3Ctext x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='80' font-family='Arial' font-weight='bold' fill='%23fff'%3EF%3C/text%3E%3C/svg%3E" alt="Avatar" />
                    <div class="create-post-input">
                        <textarea id="postContent" placeholder="Share your farming experiences, ask questions, or post tips..." rows="3"></textarea>
                        <div class="post-actions">
                            <input type="file" id="postImages" accept="image/*,video/*" multiple style="display: none;" />
                            <button type="button" class="ghost-btn" id="attachMediaBtn" style="font-size: 0.9rem; padding: 6px 12px;">📷 Media</button>
                            <button type="button" class="btn" id="submitPostBtn" style="font-size: 0.9rem; padding: 6px 12px;">Post</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="community-layout">
            <div class="community-sidebar">
                <div class="trending-section">
                    <h3>Trending Topics</h3>
                    <div id="trendingTopics" class="trending-list"></div>
                </div>
                <div class="announcements-section">
                    <h3>Announcements</h3>
                    <div id="announcements" class="announcements-list"></div>
                </div>
            </div>

            <div class="community-feed">
                <div class="feed-filters">
                    <button class="filter-tag active" data-filter="recent">Recent</button>
                    <button class="filter-tag" data-filter="popular">Popular</button>
                    <button class="filter-tag" data-filter="questions">Questions</button>
                    <button class="filter-tag" data-filter="tips">Tips</button>
                </div>
                <div id="postsFeed" class="posts-feed"></div>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script src="js/advanced-features.js"></script>
</body>
</html>
